[project]
name = "yascheduler"
# version should be changed by automation, not by hand - DON'T TOUCH
version = "1.8.0"
description = """Yet another computing scheduler and cloud orchestration engine"""
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Sergei Korolev", email = "knopki@duck.com" },
  { name = "Andrey Sobolev", email = "as@tilde.pro" },
  { name = "Anton Domnin", email = "a.v.daomnin@gmail.com" },
  { name = "Aljaz Lee", email = "uyscuti0513@gmail.com" },
  { name = "Alina Zhidkovskaya", email = "alina@mpds.io" },
  { name = "Evgeny Blokhin", email = "eb@tilde.pro" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AiiDA",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiohttp~=3.8; python_version < '3.10'",
  "aiohttp~=3.14; python_version >= '3.10'",
  "asyncssh~=2.11",
  "asyncstdlib~=3.10",
  "pg8000~=1.19",
  "python-daemon~=3.1",
  "typing-extensions >= 4.13.0; python_version < '3.13'",
]

[project.urls]
Changelog = "https://github.com/tilde-lab/yascheduler/blob/master/CHANGELOG.md"
Home = "https://github.com/tilde-lab/yascheduler"
Issues = "https://github.com/tilde-lab/yascheduler/issues"
Source = "https://github.com/tilde-lab/yascheduler"

[project.scripts]
yainit = "yascheduler.entrypoints.cli.init:init"
yanodes = "yascheduler.entrypoints.cli.show_nodes:show_nodes"
yascheduler = "yascheduler.entrypoints.cli.daemonize:daemonize"
yasetnode = "yascheduler.entrypoints.cli.manage_node:manage_node"
yastatus = "yascheduler.entrypoints.cli.check_status:check_status"
yasubmit = "yascheduler.entrypoints.cli.submit:submit"

[project.entry-points."aiida.schedulers"]
yascheduler = "yascheduler.entrypoints.aiida_plugin:YaScheduler"

[project.optional-dependencies]
azure = [
  "azure-identity~=1.16",
  "azure-mgmt-compute~=35.0.0",
  "azure-mgmt-network~=22.0.0",
]
upcloud = ["upcloud_api~=2.0"]

[dependency-groups]
dev = [
  "build",
  "commitizen",
  "import-linter>=2.5.2",
  "mdlint>=0.1",
  "prek>=0.4.10",
  "pytest~=8.0; python_version < '3.10'",
  "pytest~=9.0; python_version >= '3.10'",
  "pytest-asyncio~=1.0",
  "pytest-cov~=7.0",
  "pytest-mock~=3.0",
  "ruff>=0.16.0",
  "sqlfluff>=4.1.0; python_version < '3.10'",
  "sqlfluff>=4.2.0; python_version >= '3.10'",
  "testcontainers[postgres]~=4.0",
  "tombi>=1.2.0; python_version >= '3.10'",
  "twine",
  "zuban~=0.9",
]

[build-system]
requires = ["cython", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_files = ["pyproject.toml:^version"]
version_provider = "uv"
# The provider updates uv.lock; stage it in the same commit before tagging.
pre_bump_hooks = ["git add uv.lock"]
update_changelog_on_bump = true
changelog_incremental = true

[tool.importlinter]
root_package = "yascheduler"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
layers = [
  "yascheduler.entrypoints",
  "yascheduler.infra",
  "yascheduler.application",
  "yascheduler.domain",
  "yascheduler.shared",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = []
filterwarnings = [
  # pytest-asyncio 0.26.x uses asyncio.get_event_loop_policy()
  "ignore::DeprecationWarning:pytest_asyncio.*",
]
log_cli_format = "[%(name)s][%(funcName)s]:%(lineno)s %(message)s"
log_format = "[%(name)s][%(funcName)s]:%(lineno)s %(message)s"
markers = [
  "unit: unit tests (no external services)",
  "integration: integration tests (with testcontainers)",
  "e2e: end-to-end tests (with testcontainers)",
]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "C901",  # complexity - FIXME: enable and refactor bad code
  "BLE",  # blind except
  "D105",  # undocumented magic method
  "D107",  # undocumented __init__
  "D203",  # incorrect-blank-line-before-class
  "D213",  # multi-line-summary-second-line
  "E501",  # Line too long
  "ERA001",  # Found commented-out code
  "FBT",  # boolean positional args are fine
  "FIX002",  # we have TODOs
  "S101",  # FIXME: asserts are evil, use TypeGuard

  # When using Ruff as a formatter, we recommend avoiding the following lint rules:
  "W191",  # tab-indentation
  "E111",  # indentation-with-invalid-multiple
  "E114",  # indentation-with-invalid-multiple-comment
  "E117",  # over-indented
  "D203",  # incorrect-blank-line-before-class
  "D206",  # docstring-tab-indentation
  "D300",  # triple-single-quotes
  "Q000",  # bad-quotes-inline-string
  "Q001",  # bad-quotes-multiline-string
  "Q002",  # bad-quotes-docstring
  "Q003",  # avoidable-escaped-quote
  "Q004",  # unnecessary-escaped-quote
  "COM812",  # missing-trailing-comma
  "COM819",  # prohibited-trailing-comma
  "CPY001",  # project doesn't use copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",  # test fixtures/mocks/doubles use Any extensively
  "ARG",  # unused arguments for fixtures
  "B011",  # assert-false
  "B017",  # assert-raises-exception patterns
  "DTZ",  # datetime rules
  "D",  # tests do not need docstrings
  "EM",  # exception-message style is not load-bearing in tests
  "TRY",  # exception-message style is not load-bearing in tests
  "E402",  # module-level imports after patches are common in tests
  "FIX",
  "TD",  # TODOs in test scaffolding
  "PERF401",  # readable loops preferred over comprehensions in test data
  "PLC0415",  # local imports are used for monkeypatching/mocking
  "PLR2004",  # magic values
  "PLR0915",  # test functions are often long by nature
  "PT006",
  "PT011",
  "PT012",
  "PT015",
  "PT017",
  "PT018",
  "PT019",  # pytest style preferences
  "PYI034",  # non-self-return-type on test doubles
  "RUF002",
  "RUF003",  # arrows/symbols in test docstrings and comments
  "S",  # asserts, exec, /tmp paths, fake creds
  "SLF",  # private methods
  "TC",  # third-party imports in type-checking blocks not needed in tests
  "TID251",  # tests construct bare Task(...) directly
  "TRY",  # log/exception style not enforced in tests
]
"examples/**" = ["D", "INP", "PERF", "PTH", "S", "T201"]
"docs/_semantic_template_reference.py" = ["D", "INP"]
"yascheduler/domain/**" = ["TID251"]
"yascheduler/infra/persistence/postgres.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yascheduler.domain.Task" = { msg = "Use TodoTask/RunningTask/DoneTask/AnyTask aliases instead of the wide Task type in application/entrypoints" }
"yascheduler.domain.model.Task" = { msg = "Use TodoTask/RunningTask/DoneTask/AnyTask aliases instead of the wide Task type in application/entrypoints" }

[tool.ruff.lint.pylint]
max-args = 16  # FIXME: 16 is too much!
max-statements = 59  # FIXME: this is overcomplicated
max-branches = 21
max-returns = 7

[tool.setuptools.package-data]
"yascheduler.infra.persistence.sql" = ["**/*.sql"]
"yascheduler.data" = [
  "yascheduler.conf",
  "yascheduler.service",
  "yascheduler.sh",
]

[tool.setuptools.packages.find]
include = ["yascheduler*"]

[tool.sqlfluff.core]
templater = "placeholder"

[tool.sqlfluff.templater.placeholder]
param_style = "colon"

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "pyjwt>=2.13.0",
  "setuptools>=83.0.0; python_version >= '3.10'",
]
