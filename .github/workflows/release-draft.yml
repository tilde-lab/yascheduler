---
# yamllint disable rule:line-length
name: Draft release

on:
  push:
    branches:
      - master

permissions:
  contents: read # access to check out code and install dependencies

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  release:
    name: Bump version and create draft release
    if: github.repository == 'tilde-lab/yascheduler'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-draft
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Resolve the latest master after acquiring the concurrency slot.
          ref: master
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Create bump and changelog
        id: cz
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          previous_version=$(uv run --no-sync cz version --project)
          # 3: no commits; 21: commits exist but none requires a bump.
          # Render notes separately so pre-bump hook logs stay out of the draft.
          uv run --no-sync cz --no-raise 3,21 bump --yes --dry-run \
            --changelog-to-stdout > .CHANGELOG-CURRENT.md
          uv run --no-sync cz --no-raise 3,21 bump --yes --check-consistency
          version=$(uv run --no-sync cz version --project)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == "$previous_version" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify lockfile
        if: steps.cz.outputs.bumped == 'true'
        run: uv sync --locked --all-extras --dev

      - name: Build
        if: steps.cz.outputs.bumped == 'true'
        run: |
          uv build
          uv run --no-sync twine check dist/*

      - name: Push bump commit and tag
        if: steps.cz.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.cz.outputs.version }}
        # Publish both refs together, only after validation and build succeed.
        run: git push --atomic origin HEAD:master "refs/tags/v$VERSION"

      - name: Create Release Draft
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        if: steps.cz.outputs.bumped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          tag_name: v${{ steps.cz.outputs.version }}
          body_path: .CHANGELOG-CURRENT.md
          fail_on_unmatched_files: true
          files: dist/*
