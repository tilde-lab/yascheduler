---
# yamllint disable rule:line-length
name: Lint Code Base

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read # access to check out code and install dependencies

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: ruff format
        run: uv run ruff format --check --diff

      - name: ruff check
        run: uv run ruff check --output-format=github

      - name: type check
        run: uv run zuban check

      - name: import-linter
        run: uv run lint-imports

      - name: TOML formatter
        run: uv run tombi format --check --diff

      - name: SQL check
        run: |
          uv run sqlfluff format --dialect postgres yascheduler/infra/persistence/sql
          uv run sqlfluff lint --dialect postgres yascheduler/infra/persistence/sql

      - name: Markdown lint
        run: uv run mdlint check
